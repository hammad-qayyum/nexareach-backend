# Local development services. The backend, worker and frontend run on your machine.
#   docker compose -f deploy/docker-compose.dev.yml up -d
name: fastnexa-dev

services:
  db:
    image: postgres:16
    # Comes back by itself when Docker starts (after a reboot or a crash), with all data in the volume.
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastnexa
      POSTGRES_PASSWORD: fastnexa
      POSTGRES_DB: fastnexa_outreach
    ports:
      # 5433 so it doesn't clash with a Postgres already running on 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
      - ./dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastnexa"]
      interval: 5s
      retries: 10

  mailpit:
    # Fake mail server: catches every email the app sends. Web UI at http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  dev-db:
