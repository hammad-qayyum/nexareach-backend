# Local development services. The backend, worker and frontend run on your machine.
#   docker compose -f deploy/docker-compose.dev.yml up -d
name: fastnexa-dev

services:
  db:
    image: postgres:16
    # Comes back by itself when Docker starts (after a reboot or a crash), with all data in the volume.
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastnexa
      POSTGRES_PASSWORD: fastnexa
      POSTGRES_DB: fastnexa_outreach
    ports:
      # 5433 so it doesn't clash with a Postgres already running on 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
      - ./dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastnexa"]
      interval: 5s
      retries: 10

  mailpit:
    # Fake mail server: catches every email the app sends. Web UI at http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - ./dev/mailpit-relay.yml:/etc/mailpit-relay.yml:ro
    # Warm-up emails to the test helpers also go on to GreenMail, so the helpers really receive them
    # (helpers' answers to sender1/2@example.com go on too, so warm-up filing can be tried).
    command: ["--smtp-relay-config", "/etc/mailpit-relay.yml", "--smtp-relay-matching", "@(warmup\\.)?example\\.com$"]
    depends_on:
      - greenmail

  greenmail:
    # Test mail server with real inboxes (IMAP), for trying warm-up on this computer. Nothing leaves it.
    # Helper accounts helper1/2/3@warmup.example.com, and the dev mailboxes' own inboxes (sender1/2@example.com),
    # password "mailpit" (any new address is accepted too). SMTP 3025, IMAP 3143 (no encryption: local only).
    image: greenmail/standalone:2.1.2
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users.login=email -Dgreenmail.auth.disabled
        -Dgreenmail.users=helper1:mailpit@warmup.example.com,helper2:mailpit@warmup.example.com,helper3:mailpit@warmup.example.com,sender1:mailpit@example.com,sender2:mailpit@example.com
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"

volumes:
  dev-db:
