# Lint and tests on every push to develop or main, and on every pull request.
# A red ✗ on GitHub means: don't merge into main (production) yet.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fastnexa
          POSTGRES_PASSWORD: fastnexa
          POSTGRES_DB: fastnexa_test
        # Same address the tests use on a laptop (tests/conftest.py).
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U fastnexa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
